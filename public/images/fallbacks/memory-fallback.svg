<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="memBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24101C" />
      <stop offset="50%" stop-color="#140D13" />
      <stop offset="100%" stop-color="#090609" />
    </linearGradient>
    <radialGradient id="memGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D92D55" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#140D13" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#memBg)" />
  <circle cx="400" cy="220" r="220" fill="url(#memGlow)" />

  <!-- Film Perforations Border Top & Bottom -->
  <g fill="#FFFFFF" opacity="0.08">
    <rect x="30" y="20" width="22" height="15" rx="3" />
    <rect x="75" y="20" width="22" height="15" rx="3" />
    <rect x="120" y="20" width="22" height="15" rx="3" />
    <rect x="165" y="20" width="22" height="15" rx="3" />
    <rect x="210" y="20" width="22" height="15" rx="3" />
    <rect x="255" y="20" width="22" height="15" rx="3" />
    <rect x="300" y="20" width="22" height="15" rx="3" />
    <rect x="345" y="20" width="22" height="15" rx="3" />
    <rect x="390" y="20" width="22" height="15" rx="3" />
    <rect x="435" y="20" width="22" height="15" rx="3" />
    <rect x="480" y="20" width="22" height="15" rx="3" />
    <rect x="525" y="20" width="22" height="15" rx="3" />
    <rect x="570" y="20" width="22" height="15" rx="3" />
    <rect x="615" y="20" width="22" height="15" rx="3" />
    <rect x="660" y="20" width="22" height="15" rx="3" />
    <rect x="705" y="20" width="22" height="15" rx="3" />
    <rect x="750" y="20" width="22" height="15" rx="3" />
  </g>

  <!-- Center Emblem -->
  <g transform="translate(400, 205)" text-anchor="middle">
    <circle cx="0" cy="0" r="50" fill="#1A0B14" stroke="#D92D55" stroke-width="2" stroke-dasharray="6,4" opacity="0.8" />
    <text y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" text-anchor="middle">🎬</text>
  </g>

  <!-- Title -->
  <text x="400" y="315" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    Cherished Moment
  </text>
  <text x="400" y="345" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#EBA6B6" text-anchor="middle" letter-spacing="2">
    SAUMYAFLIX EXCLUSIVE
  </text>
  <text x="400" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#8E7884" text-anchor="middle">
    Drop photo into public/images/memories/
  </text>
</svg>
