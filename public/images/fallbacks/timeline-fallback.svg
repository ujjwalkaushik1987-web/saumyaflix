<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="timeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24101D" />
      <stop offset="50%" stop-color="#140D13" />
      <stop offset="100%" stop-color="#090609" />
    </linearGradient>
    <radialGradient id="timeGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#D92D55" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#140D13" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#timeBg)" />
  <circle cx="600" cy="300" r="280" fill="url(#timeGlow)" />

  <!-- Center Milestone Ring -->
  <g transform="translate(600, 270)" text-anchor="middle">
    <circle cx="0" cy="0" r="60" fill="#1A0B14" stroke="#D6B477" stroke-width="2.5" opacity="0.85" />
    <text y="17" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" text-anchor="middle">✨</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="400" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    Chapter in Our Story
  </text>
  <text x="600" y="440" font-family="'Playfair Display', Georgia, serif" font-size="16" font-style="italic" fill="#EBA6B6" text-anchor="middle">
    Every step led directly to you
  </text>
  <text x="600" y="485" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#8E7884" text-anchor="middle">
    Place photo in public/images/timeline/
  </text>
</svg>
