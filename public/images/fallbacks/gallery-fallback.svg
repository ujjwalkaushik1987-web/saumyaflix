<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="galBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#210F19" />
      <stop offset="60%" stop-color="#140D13" />
      <stop offset="100%" stop-color="#090609" />
    </linearGradient>
    <radialGradient id="galGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#D92D55" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#140D13" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#galBg)" />
  <circle cx="400" cy="420" r="320" fill="url(#galGlow)" />

  <!-- Elegant Inner Border -->
  <rect x="40" y="40" width="720" height="920" rx="20" fill="none" stroke="#D6B477" stroke-width="1.5" opacity="0.3" stroke-dasharray="10,6" />

  <!-- Center Heart & Camera Emblem -->
  <g transform="translate(400, 420)" text-anchor="middle">
    <circle cx="0" cy="0" r="75" fill="#1A0B14" stroke="#EBA6B6" stroke-width="2" opacity="0.8" />
    <text y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" text-anchor="middle">📷</text>
  </g>

  <!-- Typography -->
  <text x="400" y="580" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    A Beautiful Memory
  </text>
  <text x="400" y="625" font-family="'Playfair Display', Georgia, serif" font-size="18" font-style="italic" fill="#EBA6B6" text-anchor="middle">
    Captured with Love & Adoration
  </text>
  <text x="400" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#9F8490" text-anchor="middle" letter-spacing="1">
    Place photo in public/images/gallery/
  </text>
</svg>
